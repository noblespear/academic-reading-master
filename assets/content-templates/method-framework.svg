<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">论文方法架构图占位</title>
  <desc id="description">请用依据原论文绘制的完整静态中文架构图替换此文件，覆盖输入、主要模块、输出与真实分支或反馈。</desc>
  <rect x="20" y="20" width="1160" height="380" rx="16" fill="#f5f7fb" stroke="#aab8cc" stroke-width="2" stroke-dasharray="10 8"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" fill="#37445b">
    <text x="600" y="145" font-size="30" font-weight="700">论文方法架构图（待按原文绘制）</text>
    <text x="600" y="215" font-size="24">用中文呈现输入、主要模块、输出及真实分支或反馈</text>
    <text x="600" y="275" font-size="21">替换此占位文件，并在图注中注明论文依据</text>
  </g>
</svg>
