<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论文双语精读伴读</title>

  <!-- 衬线字体（离线时自动回退系统宋体，不阻塞渲染） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <!-- MathJax 3：公式渲染（需联网加载 CDN） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <!-- 顶部导航栏 -->
  <nav class="top-navbar">
    <div class="nav-left">
      <button class="icon-btn nav-burger" id="btn-burger" aria-label="目录" title="目录">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <span class="nav-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span id="nav-paper-title" class="nav-title-text">论文精读伴读</span>
      <span class="level-badge" id="level-badge" style="display:none"></span>
    </div>
    <div class="nav-actions">
      <div class="seg-control" id="seg-view" title="切换 仅中文 / 中英对照">
        <button class="seg-btn active" data-mode="zh">中文</button>
        <button class="seg-btn" data-mode="bi">对照</button>
      </div>
      <button class="icon-btn" id="btn-pdf" title="显示 / 隐藏原文 PDF（章节联动跳页）" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>原文</span>
      </button>
      <button class="icon-btn" id="btn-open-drawer" title="批注面板">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>批注</span>
        <span class="count-badge" id="top-q-count">0</span>
      </button>
      <button class="icon-btn" id="btn-print" title="打印 / 导出 PDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
    </div>
  </nav>

  <!-- 主体栅格：左目录 + 右正文（内容全部由 reader.js 渲染） -->
  <div class="layout-container" id="layout-root">

    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-title">目 录</div>
      <ul class="toc-list" id="toc-list"></ul>
      <div class="save-status" id="save-status"></div>
    </aside>

    <main class="paper-main">
      <header class="paper-header" id="paper-header"></header>
      <section id="pipeline-view"></section>
      <article id="paper-content"></article>
    </main>

  </div>

  <!-- 原文 PDF 侧栏（服务模式可用；由 reader.js 探测后显示开关） -->
  <div class="pdf-pane" id="pdf-pane">
    <div class="pdf-toolbar">
      <span class="pdf-title">原文 PDF</span>
      <span class="pdf-page-label" id="pdf-page-label"></span>
      <span style="flex:1"></span>
      <button class="drawer-close-btn" id="pdf-close" title="收起原文">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="pdf-viewport" id="pdf-viewport"></div>
  </div>

  <!-- 数据与引擎：部署时与本文件同目录 -->
  <script src="paper-data.js"></script>
  <script src="reader.js"></script>
</body>
</html>
